<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" fill="none">
  <rect width="800" height="600" fill="#F4F2ED"/>
  <!-- Architectural Grid Accent -->
  <line x1="120" y1="300" x2="680" y2="300" stroke="#E5E2DC" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="400" y1="160" x2="400" y2="440" stroke="#E5E2DC" stroke-width="1" stroke-dasharray="4 4"/>
  <!-- Optical Frame Wireframe -->
  <g stroke="#9E8256" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.65">
    <!-- Left Rim -->
    <rect x="200" y="235" width="160" height="115" rx="28" fill="#FAF9F6" fill-opacity="0.6"/>
    <!-- Right Rim -->
    <rect x="440" y="235" width="160" height="115" rx="28" fill="#FAF9F6" fill-opacity="0.6"/>
    <!-- Bridge -->
    <path d="M360 268 C380 252, 420 252, 440 268" stroke-width="2.5"/>
    <!-- Top Browline Accent -->
    <path d="M182 252 L205 245 M618 252 L595 245" stroke="#0F0F0F" stroke-width="2.5" opacity="0.45"/>
    <!-- Endpieces / Hinges -->
    <rect x="176" y="256" width="24" height="10" rx="2" fill="#9E8256" fill-opacity="0.25"/>
    <rect x="600" y="256" width="24" height="10" rx="2" fill="#9E8256" fill-opacity="0.25"/>
  </g>
  <text x="400" y="415" text-anchor="middle" fill="#8C8982" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" letter-spacing="4">OPTIHUB CHILE · ARMAZÓN ÓPTICO</text>
</svg>
